name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python test dependencies
      run: python -m pip install --upgrade pip cryptography pillow pyTelegramBotAPI requests

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run unit tests
      run: |
        python3 -m unittest discover -s tests -p 'test_margyt.py' -v
