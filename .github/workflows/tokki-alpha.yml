name: Tokki Tok Android Alpha

on:
  push:
    branches: [tokki-alpha]
    paths:
      - "patcher/**"
      - ".github/workflows/tokki-alpha.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android base
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: patcher
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp patcher/app/build/outputs/apk/debug/app-debug.apk dist/tokki-tok-alpha-0.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokki-tok-alpha-apk
          path: dist/tokki-tok-alpha-0.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tokki-tok-alpha-v0.1.0
          target_commitish: tokki-alpha
          name: Tokki Tok Alpha 0.1.0
          prerelease: true
          generate_release_notes: true
          files: dist/tokki-tok-alpha-0.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
